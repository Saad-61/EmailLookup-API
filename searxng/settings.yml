use_default_settings: true
server:
  secret_key: "antigravity_secret_key_123"
  bind_address: "0.0.0.0"
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  request_timeout: 4.0
  formats:
    - html
    - json

outgoing:
  request_timeout: 3.5
  max_request_timeout: 6.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  - name: yandex
    engine: yandex
    shortcut: yx
    timeout: 3.0
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    timeout: 3.5
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    timeout: 3.5
    disabled: false

  - name: bing
    disabled: true

  - name: google
    disabled: true

  - name: duckduckgo
    disabled: true

  - name: qwant
    disabled: true

  - name: yahoo
    disabled: true
